<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Quick Convert</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Fallbacks — overwritten at runtime from Telegram.WebApp.themeParams */
    --tg-bg: #ffffff;
    --tg-text: #1c1c1e;
    --tg-hint: #8e8e93;
    --tg-link: #2481cc;
    --tg-button: #2481cc;
    --tg-button-text: #ffffff;
    --tg-secondary-bg: #f2f2f7;
    --accent: #2481cc;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--tg-bg);
    color: var(--tg-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px calc(90px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  header {
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
  }

  header p {
    margin: 0;
    font-size: 14px;
    color: var(--tg-hint);
  }

  .category-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .tab {
    flex: 0 0 auto;
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--tg-secondary-bg);
    color: var(--tg-text);
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab.active {
    background: var(--tg-button);
    color: var(--tg-button-text);
  }

  .card {
    background: var(--tg-secondary-bg);
    border-radius: 16px;
    padding: 20px 16px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--tg-hint);
    margin-bottom: 6px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: var(--tg-bg);
    color: var(--tg-text);
    font-size: 17px;
    font-family: inherit;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }

  select {
    font-weight: 600;
  }

  .swap-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--tg-bg);
    border: none;
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    margin: 4px auto 8px;
    transition: transform 0.2s ease;
  }

  .swap-btn:active {
    transform: rotate(180deg);
  }

  .result {
    text-align: center;
    padding: 18px 0 4px;
  }

  .result .value {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .result .unit {
    font-size: 14px;
    color: var(--tg-hint);
    margin-top: 2px;
  }

  .history {
    margin-top: 24px;
  }

  .history h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--tg-hint);
    text-transform: none;
    margin: 0 0 10px;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px;
    font-size: 14px;
    border-bottom: 1px solid var(--tg-bg);
  }

  .history-item:last-child {
    border-bottom: none;
  }

  .history-empty {
    font-size: 13px;
    color: var(--tg-hint);
    padding: 8px 4px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Quick Convert</h1>
    <p>Length, weight, and temperature — instantly.</p>
  </header>

  <div class="category-tabs" id="tabs"></div>

  <div class="card">
    <div class="field">
      <label for="inputValue">Amount</label>
      <input type="text" id="inputValue" inputmode="decimal" value="1" />
    </div>

    <div class="row">
      <div class="field" style="flex:1">
        <label for="fromUnit">From</label>
        <select id="fromUnit"></select>
      </div>
    </div>

    <button class="swap-btn" id="swapBtn" aria-label="Swap units">⇅</button>

    <div class="row">
      <div class="field" style="flex:1">
        <label for="toUnit">To</label>
        <select id="toUnit"></select>
      </div>
    </div>

    <div class="result">
      <div class="value" id="resultValue">—</div>
      <div class="unit" id="resultUnit"></div>
    </div>
  </div>

  <div class="history">
    <h2>Recent</h2>
    <div id="historyList">
      <div class="history-empty">Your last few conversions will show up here.</div>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;

  // --- Apply Telegram theme ---
  function applyTheme() {
    if (!tg) return;
    const root = document.documentElement.style;
    const p = tg.themeParams || {};
    if (p.bg_color) root.setProperty('--tg-bg', p.bg_color);
    if (p.text_color) root.setProperty('--tg-text', p.text_color);
    if (p.hint_color) root.setProperty('--tg-hint', p.hint_color);
    if (p.link_color) root.setProperty('--tg-link', p.link_color);
    if (p.button_color) { root.setProperty('--tg-button', p.button_color); root.setProperty('--accent', p.button_color); }
    if (p.button_text_color) root.setProperty('--tg-button-text', p.button_text_color);
    if (p.secondary_bg_color) root.setProperty('--tg-secondary-bg', p.secondary_bg_color);
  }

  if (tg) {
    tg.ready();
    tg.expand();
    applyTheme();
    tg.onEvent('themeChanged', applyTheme);
  }

  // --- Conversion data ---
  const CATEGORIES = {
    length: {
      label: 'Length',
      base: 'm',
      units: {
        mm: { label: 'Millimeters', toBase: 0.001 },
        cm: { label: 'Centimeters', toBase: 0.01 },
        m:  { label: 'Meters', toBase: 1 },
        km: { label: 'Kilometers', toBase: 1000 },
        in: { label: 'Inches', toBase: 0.0254 },
        ft: { label: 'Feet', toBase: 0.3048 },
        mi: { label: 'Miles', toBase: 1609.344 },
      }
    },
    weight: {
      label: 'Weight',
      base: 'kg',
      units: {
        mg: { label: 'Milligrams', toBase: 0.000001 },
        g:  { label: 'Grams', toBase: 0.001 },
        kg: { label: 'Kilograms', toBase: 1 },
        lb: { label: 'Pounds', toBase: 0.453592 },
        oz: { label: 'Ounces', toBase: 0.0283495 },
      }
    },
    temperature: {
      label: 'Temperature',
      base: 'c',
      units: {
        c: { label: 'Celsius' },
        f: { label: 'Fahrenheit' },
        k: { label: 'Kelvin' },
      }
    }
  };

  let activeCategory = 'length';
  let history = [];

  const tabsEl = document.getElementById('tabs');
  const fromSel = document.getElementById('fromUnit');
  const toSel = document.getElementById('toUnit');
  const inputEl = document.getElementById('inputValue');
  const resultValueEl = document.getElementById('resultValue');
  const resultUnitEl = document.getElementById('resultUnit');
  const historyListEl = document.getElementById('historyList');
  const swapBtn = document.getElementById('swapBtn');

  function renderTabs() {
    tabsEl.innerHTML = '';
    Object.entries(CATEGORIES).forEach(([key, cat]) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (key === activeCategory ? ' active' : '');
      btn.textContent = cat.label;
      btn.onclick = () => {
        activeCategory = key;
        tg?.HapticFeedback?.selectionChanged();
        renderTabs();
        renderUnitSelectors();
        convert();
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderUnitSelectors() {
    const units = CATEGORIES[activeCategory].units;
    const keys = Object.keys(units);
    fromSel.innerHTML = keys.map(k => `<option value="${k}">${units[k].label}</option>`).join('');
    toSel.innerHTML = keys.map(k => `<option value="${k}">${units[k].label}</option>`).join('');
    fromSel.value = keys[0];
    toSel.value = keys[1] || keys[0];
  }

  function tempToCelsius(value, unit) {
    if (unit === 'c') return value;
    if (unit === 'f') return (value - 32) * 5 / 9;
    if (unit === 'k') return value - 273.15;
  }

  function celsiusToTemp(value, unit) {
    if (unit === 'c') return value;
    if (unit === 'f') return value * 9 / 5 + 32;
    if (unit === 'k') return value + 273.15;
  }

  function convert() {
    const raw = parseFloat(inputEl.value);
    const fromKey = fromSel.value;
    const toKey = toSel.value;
    const cat = CATEGORIES[activeCategory];

    if (isNaN(raw)) {
      resultValueEl.textContent = '—';
      resultUnitEl.textContent = '';
      return;
    }

    let result;
    if (activeCategory === 'temperature') {
      const celsius = tempToCelsius(raw, fromKey);
      result = celsiusToTemp(celsius, toKey);
    } else {
      const baseValue = raw * cat.units[fromKey].toBase;
      result = baseValue / cat.units[toKey].toBase;
    }

    const rounded = Math.round(result * 10000) / 10000;
    resultValueEl.textContent = rounded.toLocaleString(undefined, { maximumFractionDigits: 4 });
    resultUnitEl.textContent = cat.units[toKey].label;
  }

  function addToHistory() {
    const raw = parseFloat(inputEl.value);
    if (isNaN(raw)) return;
    const cat = CATEGORIES[activeCategory];
    const fromKey = fromSel.value;
    const toKey = toSel.value;
    const entry = `${raw} ${fromKey} → ${resultValueEl.textContent} ${toKey}`;
    history.unshift(entry);
    history = history.slice(0, 5);
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyListEl.innerHTML = '<div class="history-empty">Your last few conversions will show up here.</div>';
      return;
    }
    historyListEl.innerHTML = history.map(h => `<div class="history-item"><span>${h}</span></div>`).join('');
  }

  swapBtn.onclick = () => {
    const f = fromSel.value;
    fromSel.value = toSel.value;
    toSel.value = f;
    tg?.HapticFeedback?.impactOccurred('light');
    convert();
  };

  inputEl.addEventListener('input', convert);
  fromSel.addEventListener('change', convert);
  toSel.addEventListener('change', convert);

  // Debounced history logging on value settle
  let historyTimer;
  inputEl.addEventListener('input', () => {
    clearTimeout(historyTimer);
    historyTimer = setTimeout(addToHistory, 1200);
  });

  renderTabs();
  renderUnitSelectors();
  convert();
</script>

</body>
</html>
